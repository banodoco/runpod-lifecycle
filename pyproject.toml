[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "runpod-lifecycle"
version = "0.3.1.dev0"
description = "Reusable async RunPod lifecycle management package."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # Intel macOS has no cryptography>=50 wheels, so it stays on the 1.10.x line
  # (cryptography>=48.0.1); every other platform takes runpod>=1.12.
  "runpod>=1.10.1,<1.11; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "runpod>=1.12; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "paramiko>=3.0.0",
  "requests>=2.31.0",
  "httpx>=0.25.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.23",
  "pytest-mock>=3",
]

[project.scripts]
runpod-lifecycle = "runpod_lifecycle.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/runpod_lifecycle"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
